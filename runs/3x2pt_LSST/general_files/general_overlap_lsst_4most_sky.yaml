general:
  sacc_file: "./sacc_files/run_overlap4most_3x2pt_LSST.sacc"
  cosmology_file: "./config_yamls/cosmology.yaml"
  probes_file: "./config_yamls/probes_properties_file/probes_properties_overlap_lsst_4most_sky.yaml"
  probe_combinations_file: "./config_yamls/probes_combination.yaml"
  array_choices_file: "./config_yamls/array_choices.yaml"
  ranges_file: "./config_yamls/range_choices/LCDM_w0wa.yaml"
  priors_file: "./config_yamls/prior_choices/LCDM_w0wa_prior.yaml"

  # Select the covariance builder to use (OneCovariance, FourrierGaussianFsky or Tjpcov)
  cov_builder: "fourriergaussianfsky"

  # Select the Fisher matrix builder to use (Augur, ...)
  fisher_builder: "Augur"
  fisher_output: "./fisher_output/overlap4most/LCDM_w0wa" # Path to the output directory for the augur output.
  fisher_step: 1e-2
